name: Déploiement Infomaniak

# Envoie Wishi sur https://wishi.shi-ga.net/ en FTPS (pas de SSH sur l'hébergement).
# Dossier du site : /sites/wishi.shi-ga.net (racine web : public/).
#
# Même sécurité que le workflow de Cerebro (après l'incident du 29/10/2026 où un rsync --delete
# a vidé l'hébergement) :
# - compte FTP Infomaniak dédié, limité à /sites/wishi.shi-ga.net : sa racine « / » est ce dossier ;
# - garde-fou : avant tout envoi, la racine distante est listée, l'envoi est refusé si elle contient
#   autre chose que les fichiers de Wishi ;
# - aucune suppression côté serveur (pas de --delete) ;
# - envoi différentiel par empreintes (manifeste .deploy-manifest.json sur le serveur) : seuls les fichiers modifiés partent ;
# - data/ n'est jamais envoyé, sauf son .htaccess : la base SQLite et app_secret.key restent sur le serveur ;
# - mode essai par défaut : un push n'envoie réellement que si la variable GitHub DEPLOY_ENABLED vaut « true » ;
#   un lancement manuel (« Run workflow ») est un essai sauf si on décoche « essai ».
#
# Secrets à créer une fois : WISHI_FTP_USER et WISHI_FTP_PASSWORD
#   gh secret set WISHI_FTP_USER -R shigaepouyen/wishi
#   gh secret set WISHI_FTP_PASSWORD -R shigaepouyen/wishi
# Activer les envois automatiques, une fois l'essai validé :
#   gh variable set DEPLOY_ENABLED -b true -R shigaepouyen/wishi

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : vérifier et lister sans rien envoyer"
        type: boolean
        default: true
      complet:
        description: "Renvoyer tous les fichiers (ignore le manifeste ; à utiliser si le serveur a dérivé)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wishi-deploy
  cancel-in-progress: false

env:
  FTP_HOST: 273y4f.ftp.infomaniak.com
  # Seules entrées admises à la racine distante (fichiers de Wishi et fichiers Infomaniak)
  ALLOWED: ". .. public src views config data vendor scripts composer.json readme.md index.html .deploy-manifest.json .htaccess .user.ini .infomaniak-maintenance.html .ftpquota"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_USER: ${{ secrets.WISHI_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.WISHI_FTP_PASSWORD }}
      # Essai sauf : lancement manuel « essai » décoché, ou push avec DEPLOY_ENABLED=true
      COMPLET: ${{ inputs.complet }}
      ESSAI: ${{ ((github.event_name == 'workflow_dispatch' && !inputs.essai) || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true')) && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, pdo_sqlite
          tools: composer:v2

      - name: Vérifier la syntaxe PHP
        run: |
          find public src views config -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Dépendances de production
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      # Dossier d'envoi : seulement ce dont l'application a besoin. data/ ne contient que son .htaccess.
      - name: Préparer le paquet
        run: |
          mkdir -p deploy/data
          cp -r public src views config vendor scripts composer.json deploy/
          cp data/.htaccess deploy/data/.htaccess
          find deploy -name '.git*' -prune -exec rm -rf {} +
          test -f deploy/vendor/autoload.php
          test -f deploy/public/index.php

      - name: Vérifier les secrets FTP
        if: env.FTP_USER == '' || env.FTP_PASSWORD == ''
        run: echo "::warning::Secrets WISHI_FTP_USER / WISHI_FTP_PASSWORD absents, paquet construit mais non envoyé."

      - name: Garde-fou sur la racine distante
        if: env.FTP_USER != '' && env.FTP_PASSWORD != ''
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USER,$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate yes; cls -1a /; bye" \
            "ftp://$FTP_HOST" > racine.txt
          echo "Racine distante :"; cat racine.txt
          bad=""
          while IFS= read -r entry; do
            name="${entry%/}"; name="${name#/}"
            [ -z "$name" ] && continue
            case " $ALLOWED " in *" $name "*) ;; *) bad="$bad $name" ;; esac
          done < racine.txt
          if [ -n "$bad" ]; then
            echo "::error::Racine distante inattendue (entrées :$bad). Ce n'est pas le dossier du site Wishi : envoi annulé."
            exit 1
          fi
          echo "✔ Racine distante conforme."

      # Envoi différentiel : on compare les empreintes (SHA-256) du paquet avec le manifeste du dernier
      # déploiement, stocké sur le serveur (.deploy-manifest.json, hors public/). Les dates ne servent à rien ici :
      # GitHub récupère le code avec des dates toutes récentes, donc tout paraîtrait modifié.
      - name: Calculer les fichiers à envoyer
        if: env.FTP_USER != '' && env.FTP_PASSWORD != ''
        run: |
          old=-
          if grep -qx '/\.deploy-manifest\.json' racine.txt; then
            lftp -u "$FTP_USER,$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate yes; get /.deploy-manifest.json -o old-manifest.json; bye" \
              "ftp://$FTP_HOST"
            old=old-manifest.json
          else
            echo "Pas de manifeste sur le serveur : premier envoi complet."
          fi
          flag=""
          [ "$COMPLET" = "true" ] && flag="--complet"
          python3 .github/scripts/deploy_plan.py deploy "$old" manifest-out/.deploy-manifest.json plan.lftp $flag

      - name: Envoi sur wishi.shi-ga.net (sans suppression)
        if: env.FTP_USER != '' && env.FTP_PASSWORD != ''
        run: |
          if [ "$ESSAI" = "1" ]; then echo "Mode essai : rien ne sera envoyé."; exit 0; fi
          lftp -u "$FTP_USER,$FTP_PASSWORD" -e "set ftp:ssl-force true; set ssl:verify-certificate yes; source plan.lftp; bye" \
            "ftp://$FTP_HOST"
          echo "Publié : https://wishi.shi-ga.net/"
